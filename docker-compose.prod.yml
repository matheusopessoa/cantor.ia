# Variáveis vêm do .env do servidor, com os mesmos nomes do .env.example. Cada serviço recebe
# só o que é dele em `environment:` — não usar `env_file:`.
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api

  api:
    environment:
      NODE_ENV: prod
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env do servidor}
      JWT_SIGN_SECRET: ${JWT_SIGN_SECRET:?defina JWT_SIGN_SECRET no .env do servidor}
      EMAIL_BINDEX_SECRET: ${EMAIL_BINDEX_SECRET:?defina EMAIL_BINDEX_SECRET no .env do servidor}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS no .env do servidor}
    restart: always

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL (URL pública da API) no .env do servidor}
    environment:
      API_INTERNAL_URL: http://api:3333
    restart: always
