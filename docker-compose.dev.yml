# Variáveis vêm do .env da raiz (crie com `corepack pnpm env:init`). Cada serviço recebe só
# o que é dele em `environment:` — não usar `env_file:`, que empurraria o .env inteiro.
# Endereços entre containers (db, api) são definidos aqui, não no .env.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?rode corepack pnpm env:init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode corepack pnpm env:init}
      POSTGRES_DB: ${POSTGRES_DB:?rode corepack pnpm env:init}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    environment:
      NODE_ENV: dev
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SIGN_SECRET: ${JWT_SIGN_SECRET:?rode corepack pnpm env:init}
      EMAIL_BINDEX_SECRET: ${EMAIL_BINDEX_SECRET:?rode corepack pnpm env:init}
      # Opcional (sdd-012): vazia desliga a revisão da letra (503 em /api/review/*).
      LYRICS_REVIEW_SECRET: ${LYRICS_REVIEW_SECRET:-}
      WORKER_URL: http://worker:8000
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
    environment:
      API_INTERNAL_URL: http://api:3333
    depends_on:
      - api

volumes:
  db_data:
