# docker-compose.yml (Base)
services:
  api:
    build:
      # Contexto na raiz: o pnpm-lock.yaml e o pnpm-workspace.yaml ficam aqui.
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3333:3333"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"

  # Extração de pitch (Python). Sem variáveis de ambiente no MVP. A porta fica exposta só
  # para desenvolvimento; a API fala com ele por http://worker:8000 (WORKER_URL, definido
  # nos compose de dev e prod).
  worker:
    build:
      context: apps/worker
    ports:
      - "8000:8000"